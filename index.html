<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e7c7b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Circuit" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>My Strength Circuit</title>
  </head>
  <body data-screen="setup">
    <main>
      <section id="setup" aria-labelledby="setup-title">
        <h1 id="setup-title">My Strength Circuit</h1>
        <p class="lede">No equipment. Just you and some floor space.</p>

        <fieldset>
          <legend>Rounds</legend>
          <div class="choices">
            <label><input type="radio" name="rounds" value="1" /><span>1</span></label>
            <label><input type="radio" name="rounds" value="2" checked /><span>2</span></label>
            <label><input type="radio" name="rounds" value="3" /><span>3</span></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Each move</legend>
          <div class="choices">
            <label><input type="radio" name="work" value="30" checked /><span>30 sec</span></label>
            <label><input type="radio" name="work" value="40" /><span>40 sec</span></label>
          </div>
        </fieldset>

        <label class="toggle"><input type="checkbox" id="sound" checked /> Sounds and voice</label>

        <p class="total" id="total" aria-live="polite"></p>
        <button type="button" id="start" class="big">Start</button>

        <ol class="move-list" id="move-list" aria-label="The moves"></ol>
      </section>

      <section id="run" aria-label="Workout" hidden>
        <div class="top">
          <span id="round"></span>
          <span id="step"></span>
        </div>
        <div class="overall" aria-hidden="true"><div id="overall-bar"></div></div>

        <h2 id="move-name" aria-live="assertive"></h2>
        <p id="cue" class="cue"></p>
        <div class="stage">
          <svg id="art" viewBox="0 0 160 92" role="img" aria-label=""></svg>
          <div class="clock">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="track" cx="60" cy="60" r="52" />
              <circle class="ring" id="ring" cx="60" cy="60" r="52" />
            </svg>
            <span id="seconds" role="timer" aria-live="off"></span>
          </div>
        </div>
        <p id="next" class="next"></p>

        <div class="controls">
          <button type="button" id="quit" class="ghost">Stop</button>
          <button type="button" id="pause" class="big">Pause</button>
          <button type="button" id="skip" class="ghost">Skip</button>
        </div>
      </section>

      <section id="done" aria-labelledby="done-title" hidden>
        <p class="stars" aria-hidden="true">★ ★ ★</p>
        <h2 id="done-title">Great job!</h2>
        <p class="lede" id="done-summary"></p>
        <p>Don't forget to tick today on your poster.</p>
        <button type="button" id="again" class="big">Back to start</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
