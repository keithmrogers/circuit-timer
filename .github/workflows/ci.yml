name: ci

# On a v* tag, also builds and pushes ghcr.io/keithmrogers/circuit-timer:<tag>
# (tag kept as-is, e.g. v0.1.0), which the homelab stack pins.
# Same shape as scavenger-v2's ci.yml: checks, build-and-test, image.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/circuit-timer

jobs:
  # Guardrails: workflow lint, known-vulnerable dependencies, release script checks.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint workflows (actionlint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: Release scripts
        run: .github/scripts/test.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm packages with known vulnerabilities (high or critical)
        run: npm ci --no-audit --no-fund && npm audit --audit-level=high

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build (typecheck + vite)
        run: npm ci && npm run build

      - name: Browser for the page tests (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: CI=1 npx playwright test

  image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=short

      - name: Build (and push on a v* tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
